<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#03010f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fischteich Angel">
    <title>Fischteich Angel</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css?v=24">
    <script src="./script.js?v=11" defer></script>
  </head>
  <body>
    <div id="app">
      <section class="screen menu-screen is-active" id="menu-screen" aria-label="Hauptmenü">
        <img
          class="menu-background"
          src="./assets/menu-background.png?v=2"
          alt=""
          width="853"
          height="1844"
          draggable="false"
          aria-hidden="true"
        >
        <div class="menu-card">
          <div class="menu-actions">
            <button id="start-two-teams" type="button" aria-label="Angel auswerfen">
              <img src="./assets/button-angel-auswerfen.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
            <button id="start-roulette" type="button" aria-label="Wer beißt zuerst?">
              <img src="./assets/button-wer-beisst-zuerst.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
            <button id="open-team-choice" type="button" aria-label="Mehr Teams">
              <img src="./assets/button-mehr-teams.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
          </div>
        </div>
      </section>

      <section class="screen choice-screen" id="team-choice-screen" aria-labelledby="team-choice-title" hidden>
        <button class="close-button screen-back" type="button" aria-label="Zurück zum Hauptmenü">×</button>
        <div class="choice-card">
          <p class="eyebrow">Fanggruppe festlegen</p>
          <h2 id="team-choice-title">Wie viele Teams?</h2>
          <div class="team-options" aria-label="Teamanzahl auswählen">
            <button type="button" data-team-count="2">2</button>
            <button type="button" data-team-count="3">3</button>
            <button type="button" data-team-count="4">4</button>
            <button type="button" data-team-count="5">5</button>
            <button type="button" data-team-count="6">6</button>
          </div>
        </div>
      </section>

      <section class="screen game-screen" id="game-screen" aria-labelledby="fish-counter" hidden>
        <button class="close-button" id="leave-game" type="button" aria-label="Auslosung verlassen">×</button>
        <h2 id="fish-counter" aria-live="polite">Fische im Teich: 0</h2>
        <div id="play-zone" aria-label="Hier tippen, um Spieler zu registrieren"></div>
        <div id="player-layer" aria-hidden="true"></div>
        <div class="game-action-area">
          <button class="settings-button" id="open-team-settings" type="button" aria-label="Teamanzahl einstellen">
            <span aria-hidden="true">⚙</span>
          </button>
          <button class="fish-button" id="draw-teams" type="button" disabled>Angeln</button>
          <button class="participant-button" id="open-participant-selection" type="button" aria-label="Teilnehmer auswählen">
            <span aria-hidden="true">👥</span>
          </button>
        </div>
      </section>

      <section class="screen participant-screen" id="participant-screen" aria-labelledby="participant-title" hidden>
        <button class="close-button" id="close-participant-selection" type="button" aria-label="Zurück zum Finger-Tippen-Screen">×</button>
        <div class="participant-shell">
          <h2 id="participant-title">Teilnehmer auswählen</h2>

          <div class="participant-columns">
            <section class="participant-column" aria-labelledby="available-participants-title">
              <h3 id="available-participants-title">Verfügbar</h3>
              <div class="participant-list" id="available-participants"></div>
            </section>

            <section class="participant-column participant-column-selected" aria-labelledby="selected-participants-title">
              <h3 id="selected-participants-title">Ausgewählt</h3>
              <div class="participant-list" id="selected-participants"></div>
            </section>
          </div>

          <div class="participant-actions">
            <button class="participant-guest-button" id="guest-fish-button" type="button">+ Gast Fisch hinzufügen</button>
            <button class="participant-continue-button" id="participant-continue-button" type="button" disabled>Weiter</button>
          </div>
        </div>
      </section>

      <section class="screen manual-team-screen" id="manual-team-screen" aria-labelledby="manual-team-title" hidden>
        <button class="close-button manual-team-back-button" id="close-manual-team-screen" type="button" aria-label="Zurück zur Teilnehmerauswahl">←</button>
        <div class="manual-team-shell">
          <div class="manual-team-scroll">
            <header class="manual-team-header">
              <h2 id="manual-team-title">Fische im Teich:</h2>
              <p id="manual-team-participant-names"></p>
            </header>

            <div class="manual-team-grid" id="manual-team-grid">
              <button class="manual-add-team-button" id="add-manual-team" type="button" aria-label="Weiteres Team hinzufügen">+</button>
            </div>
          </div>

          <div class="manual-team-actions">
            <button class="manual-divide-button" id="divide-manual-teams" type="button">Teams aufteilen</button>
          </div>
        </div>
      </section>

      <section class="screen roulette-screen" id="roulette-screen" aria-labelledby="roulette-title" hidden>
        <button class="close-button screen-back" type="button" aria-label="Zurück zum Hauptmenü">×</button>
        <div class="roulette-content">
          <p class="eyebrow">Die erste Flosse gehört …</p>
          <h2 id="roulette-title">Wer beißt zuerst?</h2>
          <div class="roulette-window" aria-hidden="true">
            <div class="roulette-marker"></div>
            <div class="roulette-strip" id="roulette-strip"></div>
          </div>
          <p class="roulette-result" id="roulette-result" aria-live="polite"></p>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="leave-modal" role="dialog" aria-modal="true" aria-labelledby="leave-title" hidden>
      <div class="modal-card">
        <h2 id="leave-title">Zurück zum Menü?</h2>
        <p>Die aktuelle Auslosung wird gelöscht.</p>
        <div class="modal-actions">
          <button class="secondary-button" id="cancel-leave" type="button">Nein</button>
          <button class="primary-button" id="confirm-leave" type="button">Ja</button>
        </div>
      </div>
    </div>

    <div class="team-settings-backdrop" id="team-settings-modal" role="dialog" aria-modal="true" aria-labelledby="team-settings-title" hidden>
      <div class="team-settings-card">
        <h2 id="team-settings-title">Wie viele Teams?</h2>
        <div class="game-team-options" aria-label="Teamanzahl auswählen">
          <button type="button" data-game-team-count="2">2</button>
          <button type="button" data-game-team-count="3">3</button>
          <button type="button" data-game-team-count="4">4</button>
          <button type="button" data-game-team-count="5">5</button>
          <button type="button" data-game-team-count="6">6</button>
          <button type="button" data-game-team-count="7">7</button>
          <button type="button" data-game-team-count="8">8</button>
          <button type="button" data-game-team-count="9">9</button>
          <button type="button" data-game-team-count="10">10</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop guest-fish-backdrop" id="guest-fish-modal" role="dialog" aria-modal="true" aria-labelledby="guest-fish-title" hidden>
      <form class="modal-card guest-fish-card" id="guest-fish-form" novalidate>
        <h2 id="guest-fish-title">Gast Fisch hinzufügen</h2>
        <label class="visually-hidden" for="guest-fish-name">Name des Gastfischs</label>
        <input
          class="guest-fish-input"
          id="guest-fish-name"
          name="guestFishName"
          type="text"
          maxlength="24"
          autocomplete="off"
          autocapitalize="words"
          autocorrect="off"
          enterkeyhint="done"
          spellcheck="false"
          aria-describedby="guest-fish-error"
        >
        <p class="guest-fish-error" id="guest-fish-error" aria-live="polite" hidden>Bitte einen Namen eingeben.</p>
        <div class="modal-actions guest-fish-actions">
          <button class="secondary-button" id="cancel-guest-fish" type="button">Abbrechen</button>
          <button class="primary-button" id="confirm-guest-fish" type="submit">OK</button>
        </div>
      </form>
    </div>

  </body>
</html>
