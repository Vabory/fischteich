<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#03010f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fischteich Angel">
    <title>Fischteich Angel</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css?v=15">
    <script src="./script.js?v=5" defer></script>
  </head>
  <body>
    <div id="app">
      <section class="screen menu-screen is-active" id="menu-screen" aria-label="Hauptmenü">
        <img
          class="menu-background"
          src="./assets/menu-background.png?v=2"
          alt=""
          width="853"
          height="1844"
          draggable="false"
          aria-hidden="true"
        >
        <div class="menu-card">
          <div class="menu-actions">
            <button id="start-two-teams" type="button" aria-label="Angel auswerfen">
              <img src="./assets/button-angel-auswerfen.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
            <button id="start-roulette" type="button" aria-label="Wer beißt zuerst?">
              <img src="./assets/button-wer-beisst-zuerst.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
            <button id="open-team-choice" type="button" aria-label="Mehr Teams">
              <img src="./assets/button-mehr-teams.png?v=2" alt="" width="2172" height="724" draggable="false">
            </button>
          </div>
        </div>
      </section>

      <section class="screen choice-screen" id="team-choice-screen" aria-labelledby="team-choice-title" hidden>
        <button class="close-button screen-back" type="button" aria-label="Zurück zum Hauptmenü">×</button>
        <div class="choice-card">
          <p class="eyebrow">Fanggruppe festlegen</p>
          <h2 id="team-choice-title">Wie viele Teams?</h2>
          <div class="team-options" aria-label="Teamanzahl auswählen">
            <button type="button" data-team-count="2">2</button>
            <button type="button" data-team-count="3">3</button>
            <button type="button" data-team-count="4">4</button>
            <button type="button" data-team-count="5">5</button>
            <button type="button" data-team-count="6">6</button>
          </div>
        </div>
      </section>

      <section class="screen game-screen" id="game-screen" aria-labelledby="fish-counter" hidden>
        <button class="close-button" id="leave-game" type="button" aria-label="Auslosung verlassen">×</button>
        <h2 id="fish-counter" aria-live="polite">Fische im Teich: 0</h2>
        <div id="play-zone" aria-label="Hier tippen, um Spieler zu registrieren"></div>
        <div id="player-layer" aria-hidden="true"></div>
        <div class="game-action-area">
          <button class="fish-button" id="draw-teams" type="button" disabled>Angeln</button>
        </div>
      </section>

      <section class="screen roulette-screen" id="roulette-screen" aria-labelledby="roulette-title" hidden>
        <button class="close-button screen-back" type="button" aria-label="Zurück zum Hauptmenü">×</button>
        <div class="roulette-content">
          <p class="eyebrow">Die erste Flosse gehört …</p>
          <h2 id="roulette-title">Wer beißt zuerst?</h2>
          <div class="roulette-window" aria-hidden="true">
            <div class="roulette-marker"></div>
            <div class="roulette-strip" id="roulette-strip"></div>
          </div>
          <p class="roulette-result" id="roulette-result" aria-live="polite"></p>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="leave-modal" role="dialog" aria-modal="true" aria-labelledby="leave-title" hidden>
      <div class="modal-card">
        <h2 id="leave-title">Zurück zum Menü?</h2>
        <p>Die aktuelle Auslosung wird gelöscht.</p>
        <div class="modal-actions">
          <button class="secondary-button" id="cancel-leave" type="button">Nein</button>
          <button class="primary-button" id="confirm-leave" type="button">Ja</button>
        </div>
      </div>
    </div>

  </body>
</html>
