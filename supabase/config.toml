[auth]
# Hosted projects must enable the matching "Allow anonymous sign-ins" setting
# in the Supabase Dashboard separately; this entry configures local Supabase.
enable_anonymous_sign_ins = true

[functions.buffalo-push-worker]
verify_jwt = false

[functions.buffalo-shortcut]
# Apple Shortcuts/Watch and Android HTTP automations do not hold a Supabase JWT.
# The function validates its own per-device token for start requests and
# validates a Supabase access token explicitly for setup/reset requests.
verify_jwt = false
